<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Everything runs locally: no requests leave this page, and the browser enforces it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>TibiaViewer</title>
<meta name="description" content="Browse your Tibia screenshots by character, kind and month. Runs entirely in your browser; nothing is uploaded.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/boot.js"></script>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3.5 4M16 6h3a3 3 0 0 1-3.5 4M12 13v4M8 20h8M10 17h4v3h-4z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13M8 7h7"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol>
  <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8c0 3 1.5 4.6 3 5.5V21h10v-4.5c1.5-.9 3-2.5 3-5.5a8 8 0 0 0-8-8zM10 21v-3M14 21v-3"/><circle cx="9" cy="11.5" r="1.6"/><circle cx="15" cy="11.5" r="1.6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></symbol>
  <symbol id="i-sword" viewBox="0 0 24 24"><path d="M20 4L9.5 14.5M20 4h-4.5M20 4v4.5M6.5 11.5l6 6M4 20l4-4"/></symbol>
  <symbol id="i-heal" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11.2a6 6 0 0 1-12 0C6 10 12 3 12 3z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10h5"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M12 3l8 9-8 9-8-9z"/></symbol>
  <symbol id="i-all" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12.2l2.2 2.2 4.3-4.6"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10v11H9z"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5M3 14l2-1h3.5l1.5 2.5h4l1.5-2.5H19l2 1v5.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.6 5.7 3.6 9s-1.1 6.3-3.6 9c-2.5-2.7-3.6-5.7-3.6-9S9.5 5.7 12 3z"/></symbol>
</svg>

<div class="app">
  <aside class="side frame" id="side">
    <div class="brand">
      <h1 class="gothic">TibiaViewer</h1>
      <p id="brandSub"></p>
    </div>
    <nav class="roster" id="roster"></nav>
    <div class="side-foot">
      <div id="sideStatus" class="status-block"></div>
      <div class="row">
        <button class="btn" id="themeBtn" type="button"></button>
        <label class="lang">
          <svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg>
          <span class="sr-only" id="langLabel"></span>
          <select id="langSel"></select>
        </label>
      </div>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>

<dialog class="viewer frame" id="viewer">
  <div class="stage" id="stage"><img id="vimg" alt=""></div>
  <div class="vbar">
    <div class="vinfo" id="vinfo"></div>
    <div class="vactions">
      <button class="btn" type="button" id="vprev"></button>
      <button class="btn" type="button" id="vnext"></button>
      <a class="btn" id="vopen" target="_blank" rel="noopener noreferrer"></a>
      <button class="btn" type="button" id="vclose"></button>
    </div>
  </div>
</dialog>

<div class="drop-overlay" id="dropOverlay" aria-hidden="true"><div class="frame"><svg class="ic"><use href="#i-inbox"/></svg><span id="dropOverlayText"></span></div></div>
<div class="toast frame" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" webkitdirectory multiple hidden>

<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
